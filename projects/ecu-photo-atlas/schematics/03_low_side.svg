<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900"><rect width="1800" height="1900" fill="white"/><text x="55" y="90" font-family="Leelawadee UI,Tahoma" font-size="51" fill="#153449">วงจร 03 • ภาคขับโหลดแบบ Low-side</text><rect x="40" y="125" width="1720" height="130" fill="#fff0cf"/><foreignObject x="65" y="145" width="1670" height="100"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><b>วงจรสอนอ่านที่ผู้จัดทำวาดขึ้น — ไม่ใช่วงจรจริงของกล่อง 01–07</b><br/>ตัวเลขเป็นเงื่อนไขตัวอย่าง ห้ามนำไปป้อนไฟหรือตัดสินจุดจริงในภาพ</div></foreignObject><text x="75" y="350" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">V_SUPPLY ตัวอย่าง 12 V</text><path d="M180,400 L180,470" stroke="#17394e" stroke-width="5" fill="none"/><path d="M180,470 L650,470" stroke="#17394e" stroke-width="5" fill="none"/><path d="M650,470 C650,400 705,400 705,470 C705,400 762,400 762,470 C762,400 820,400 820,470 C820,400 880,400 880,470" stroke="#17394e" stroke-width="5" fill="none"/><text x="650" y="405" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">L_LOAD</text><path d="M880,470 L1150,470" stroke="#17394e" stroke-width="5" fill="none"/><circle cx="1150" cy="470" r="9" fill="#c8740a"/><text x="1120" y="442" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">D</text><path d="M1150,470 L1150,650" stroke="#17394e" stroke-width="5" fill="none"/><rect x="970" y="650" width="390" height="170" rx="12" fill="#edf6fa" stroke="#17394e" stroke-width="4"/><text x="988" y="705" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">Q1 สวิตช์ Low-side</text><text x="1280" y="700" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">D</text><text x="985" y="785" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">G</text><text x="1080" y="795" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">S</text><path d="M1150,820 L1150,895" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1150,895 L1150,920" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1120,920 L1180,920" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1130,932 L1170,932" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1140,944 L1160,944" stroke="#17394e" stroke-width="5" fill="none"/><path d="M970,750 L740,750" stroke="#17394e" stroke-width="5" fill="none"/><path d="M560,750 L580,750" stroke="#17394e" stroke-width="5" fill="none"/><rect x="580" y="735" width="140" height="30" fill="white" stroke="#17394e" stroke-width="4"/><path d="M720,750 L740,750" stroke="#17394e" stroke-width="5" fill="none"/><text x="560" y="705" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">R_GATE</text><path d="M560,750 L260,750" stroke="#17394e" stroke-width="5" fill="none"/><text x="60" y="750" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">คำสั่ง Gate</text><path d="M520,470 L520,305" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1000,470 L1000,305" stroke="#17394e" stroke-width="5" fill="none"/><path d="M520,305 L705,305" stroke="#17394e" stroke-width="5" fill="none"/><path d="M815,305 L1000,305" stroke="#17394e" stroke-width="5" fill="none"/><path d="M705,275 L705,335 M705,305 L815,275 L815,335 Z" fill="white" stroke="#17394e" stroke-width="4"/><text x="550" y="275" font-family="Leelawadee UI,Tahoma" font-size="25" fill="#153449">วงจรคลายพลังงาน: คาโทดหันไป V_SUPPLY</text><foreignObject x="65" y="1000" width="1660" height="740"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><h3>คำสั่งกับแรงดันเอาต์พุตไม่ใช่สิ่งเดียวกัน</h3><p>ในสวิตช์อุดมคติ เมื่อ Q1 เปิด จุด D เข้าใกล้กราวด์ เมื่อ Q1 ปิดและกระแสโหลดคลายหมดแล้ว จุด D อาจเข้าใกล้ V_SUPPLY หากโหลดยังต่ออยู่ ค่าระหว่างเปลี่ยนสถานะมี transient จึงใช้ตัวเลข DC เดียวแทนไม่ได้</p><p>รูปโหลดเป็นสัญลักษณ์เชิงหน้าที่ ไม่ระบุว่ากล่องใดขับหัวฉีด คอยล์ มอเตอร์ หรือ SCV ภาคขับจริงอาจใช้ clamp/boost/half-bridge ต่างจากภาพนี้</p><p><b>ก่อนวัด:</b> รู้ขา Gate/Drain/Source จาก datasheet และเน็ตจริง ตรวจพิกัด differential/common-mode ของโพรบ ห้ามหนีบกราวด์สโคปแบบต่อ earth ลงจุดสวิตชิ่งโดยไม่รู้ reference</p><p>ผล Gate เปลี่ยนแต่เอาต์พุตไม่เปลี่ยนยังต้องแยกโหลด สายไฟ แหล่งจ่าย วงจรป้องกัน และตัวขับ ไม่ใช่ตัดสิน Q1 เสียทันที</p></div></foreignObject><foreignObject x="65" y="1770" width="1660" height="90"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e">สัญลักษณ์เป็นขาหน้าที่ ไม่ใช่เลขขาแพ็กเกจ • ก่อนใช้จริงต้องมี datasheet / pinout / net ที่พิสูจน์แล้ว</div></foreignObject></svg>