<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900"><rect width="1800" height="1900" fill="white"/><text x="55" y="90" font-family="Leelawadee UI,Tahoma" font-size="51" fill="#153449">วงจร 01 • อ่านทางจ่ายไฟและเรกูเลเตอร์</text><rect x="40" y="125" width="1720" height="130" fill="#fff0cf"/><foreignObject x="65" y="145" width="1670" height="100"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><b>วงจรสอนอ่านที่ผู้จัดทำวาดขึ้น — ไม่ใช่วงจรจริงของกล่อง 01–07</b><br/>ตัวเลขเป็นเงื่อนไขตัวอย่าง ห้ามนำไปป้อนไฟหรือตัดสินจุดจริงในภาพ</div></foreignObject><text x="70" y="350" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">แหล่งจ่ายตัวอย่าง 12 V</text><rect x="380" y="410" width="410" height="220" rx="12" fill="#edf6fa" stroke="#17394e" stroke-width="4"/><text x="398" y="465" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">U1 TPS7B8250-Q1</text><rect x="1090" y="410" width="410" height="220" rx="12" fill="#edf6fa" stroke="#17394e" stroke-width="4"/><text x="1108" y="465" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">U2 TLV76733-Q1</text><path d="M100,470 L380,470" stroke="#17394e" stroke-width="5" fill="none"/><path d="M790,470 L1090,470" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1500,470 L1690,470" stroke="#17394e" stroke-width="5" fill="none"/><text x="395" y="500" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">IN</text><text x="690" y="500" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">OUT</text><text x="1110" y="500" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">IN</text><text x="1400" y="500" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">OUT</text><text x="520" y="600" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">GND</text><text x="1220" y="600" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">GND</text><circle cx="250" cy="470" r="9" fill="#c8740a"/><text x="220" y="442" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">T1</text><circle cx="930" cy="470" r="9" fill="#c8740a"/><text x="900" y="442" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">T2</text><circle cx="1620" cy="470" r="9" fill="#c8740a"/><text x="1590" y="442" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">T3</text><text x="205" y="410" font-family="Leelawadee UI,Tahoma" font-size="36" fill="#153449">12 V</text><text x="880" y="410" font-family="Leelawadee UI,Tahoma" font-size="36" fill="#153449">5 V nominal</text><text x="1510" y="410" font-family="Leelawadee UI,Tahoma" font-size="36" fill="#153449">3.3 V nominal</text><path d="M250,470 L250,505" stroke="#17394e" stroke-width="5" fill="none"/><path d="M222,505 L278,505" stroke="#17394e" stroke-width="5" fill="none"/><path d="M222,520 L278,520" stroke="#17394e" stroke-width="5" fill="none"/><path d="M250,520 L250,820" stroke="#17394e" stroke-width="5" fill="none"/><path d="M930,470 L930,505" stroke="#17394e" stroke-width="5" fill="none"/><path d="M902,505 L958,505" stroke="#17394e" stroke-width="5" fill="none"/><path d="M902,520 L958,520" stroke="#17394e" stroke-width="5" fill="none"/><path d="M930,520 L930,820" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1620,470 L1620,505" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1592,505 L1648,505" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1592,520 L1648,520" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1620,520 L1620,820" stroke="#17394e" stroke-width="5" fill="none"/><path d="M580,630 L580,820" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1290,630 L1290,820" stroke="#17394e" stroke-width="5" fill="none"/><path d="M180,820 L1700,820" stroke="#17394e" stroke-width="5" fill="none"/><path d="M580,820 L580,845" stroke="#17394e" stroke-width="5" fill="none"/><path d="M550,845 L610,845" stroke="#17394e" stroke-width="5" fill="none"/><path d="M560,857 L600,857" stroke="#17394e" stroke-width="5" fill="none"/><path d="M570,869 L590,869" stroke="#17394e" stroke-width="5" fill="none"/><text x="650" y="885" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">GND ร่วมในวงจรตัวอย่างเท่านั้น</text><text x="120" y="700" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">C_IN</text><text x="810" y="700" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">C_OUT1</text><text x="1500" y="700" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">C_OUT2</text><foreignObject x="65" y="1000" width="1660" height="740"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><h3>ไล่วัดตามลำดับ T1 → T2 → T3</h3><p>เมื่อแหล่งจ่ายเป็น 12 V และเรกูเลเตอร์เปิดทำงานถูกต้องในข้อกำหนด T2 เป็นเอาต์พุตพิกัด 5 V ของรุ่นย่อยที่ระบุ และ T3 เป็นเอาต์พุตพิกัด 3.3 V ค่าจริงมีความคลาดเคลื่อนตาม datasheet ไม่ใช่เกณฑ์ยอมรับของ ECU ทั้งเจ็ด</p><p><b>สายดำ:</b> GND ที่ยืนยันแล้วของรางนั้น <b>สายแดง:</b> T1/T2/T3 ทีละจุด ภาพย่อไม่ได้แสดง EN และขาควบคุมทั้งหมด ต้องตรวจขาเหล่านี้ด้วยเมื่อ IN มีไฟแต่ OUT ไม่มี</p><p>ถ้า OUT ต่ำ อย่าเปลี่ยน U1/U2 ทันที ต้องแยกโหลดลัดวงจร เงื่อนไข enable กระแสจำกัด ความร้อน และอุปกรณ์กรอง ค่าคาปาซิเตอร์/ความเสถียรต้องใช้เอกสารของรุ่นย่อย ไม่เลือกจากภาพนี้</p><p>แหล่ง: TI TPS7B82-Q1 และ TLV767-Q1 หน้า product/datasheet (ลิงก์ใน README) ไม่ใช่การระบุว่า IC เหล่านี้อยู่ในภาพกล่อง</p></div></foreignObject><foreignObject x="65" y="1770" width="1660" height="90"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e">สัญลักษณ์เป็นขาหน้าที่ ไม่ใช่เลขขาแพ็กเกจ • ก่อนใช้จริงต้องมี datasheet / pinout / net ที่พิสูจน์แล้ว</div></foreignObject></svg>