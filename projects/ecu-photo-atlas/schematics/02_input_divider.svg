<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900"><rect width="1800" height="1900" fill="white"/><text x="55" y="90" font-family="Leelawadee UI,Tahoma" font-size="51" fill="#153449">วงจร 02 • ภาครับสัญญาณและตัวกรอง</text><rect x="40" y="125" width="1720" height="130" fill="#fff0cf"/><foreignObject x="65" y="145" width="1670" height="100"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><b>วงจรสอนอ่านที่ผู้จัดทำวาดขึ้น — ไม่ใช่วงจรจริงของกล่อง 01–07</b><br/>ตัวเลขเป็นเงื่อนไขตัวอย่าง ห้ามนำไปป้อนไฟหรือตัดสินจุดจริงในภาพ</div></foreignObject><text x="80" y="350" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">แบบฝึก: V_REF = 5.00 V (สมมติ)</text><path d="M110,450 L300,450" stroke="#17394e" stroke-width="5" fill="none"/><path d="M300,450 L320,450" stroke="#17394e" stroke-width="5" fill="none"/><rect x="320" y="435" width="190" height="30" fill="white" stroke="#17394e" stroke-width="4"/><path d="M510,450 L530,450" stroke="#17394e" stroke-width="5" fill="none"/><text x="340" y="408" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">R1</text><path d="M530,450 L650,450" stroke="#17394e" stroke-width="5" fill="none"/><circle cx="650" cy="450" r="9" fill="#c8740a"/><text x="620" y="422" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">T_ADC</text><path d="M650,450 L650,560" stroke="#17394e" stroke-width="5" fill="none"/><path d="M650,560 L670,560" stroke="#17394e" stroke-width="5" fill="none"/><rect x="670" y="545" width="140" height="30" fill="white" stroke="#17394e" stroke-width="4"/><path d="M810,560 L830,560" stroke="#17394e" stroke-width="5" fill="none"/><path d="M830,560 L830,780" stroke="#17394e" stroke-width="5" fill="none"/><path d="M830,780 L830,805" stroke="#17394e" stroke-width="5" fill="none"/><path d="M800,805 L860,805" stroke="#17394e" stroke-width="5" fill="none"/><path d="M810,817 L850,817" stroke="#17394e" stroke-width="5" fill="none"/><path d="M820,829 L840,829" stroke="#17394e" stroke-width="5" fill="none"/><text x="665" y="630" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">R2</text><path d="M650,450 L1000,450" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1000,450 L1020,450" stroke="#17394e" stroke-width="5" fill="none"/><rect x="1020" y="435" width="140" height="30" fill="white" stroke="#17394e" stroke-width="4"/><path d="M1160,450 L1180,450" stroke="#17394e" stroke-width="5" fill="none"/><text x="1020" y="405" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">R_SER</text><path d="M1180,450 L1510,450" stroke="#17394e" stroke-width="5" fill="none"/><rect x="1510" y="390" width="220" height="190" rx="12" fill="#edf6fa" stroke="#17394e" stroke-width="4"/><text x="1528" y="445" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">ADC input</text><path d="M1350,450 L1350,485" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1322,485 L1378,485" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1322,500 L1378,500" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1350,500 L1350,780" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1350,780 L1350,805" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1320,805 L1380,805" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1330,817 L1370,817" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1340,829 L1360,829" stroke="#17394e" stroke-width="5" fill="none"/><text x="1390" y="680" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">C_FILTER</text><text x="60" y="930" font-family="Leelawadee UI,Tahoma" font-size="43" fill="#153449">สูตร: V_NODE = V_REF × R2 / (R1 + R2)</text><foreignObject x="65" y="1000" width="1660" height="740"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><h3>ตัวเลขตัวอย่างต้องมาจากเงื่อนไข</h3><p>สมมติ R1 = R2, ไม่มีโหลดดึงกระแสจากจุดแบ่ง และ V_REF = 5.00 V จะได้ T_ADC ก่อน R_SER เท่ากับ <b>2.50 V</b> ในแบบอุดมคติ นี่คือผลคำนวณ ไม่ใช่สเปกเซ็นเซอร์รถจริง</p><p>R_SER กับ C_FILTER ช่วยให้เห็นว่าจุดก่อนและหลังอุปกรณ์อาจตอบสนองต่างกันตามเวลา ต้องแยกแรงดัน DC ออกจากการเปลี่ยนแปลงของสัญญาณ และไม่ตีความ C เป็นทางลัดวงจรจากเสียงบี๊บช่วงชาร์จ</p><p>บนกล่องจริง ให้เริ่มจากขาสัญญาณที่ยืนยันแล้ว ไล่ผ่าน R/อุปกรณ์ป้องกันไปยังขารับ IC และระบุกราวด์สัญญาณ ห้ามถือว่าทุกขาอินพุตควรได้ 2.50 V หรือทุกเซ็นเซอร์ใช้ 5 V</p><p>สัญลักษณ์นี้ไม่แสดง protection/clamp ทุกตัว ไม่ใช่วงจรสำหรับนำไปต่อกับ ADC จริงโดยไม่ตรวจข้อจำกัดอินพุต</p></div></foreignObject><foreignObject x="65" y="1770" width="1660" height="90"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e">สัญลักษณ์เป็นขาหน้าที่ ไม่ใช่เลขขาแพ็กเกจ • ก่อนใช้จริงต้องมี datasheet / pinout / net ที่พิสูจน์แล้ว</div></foreignObject></svg>