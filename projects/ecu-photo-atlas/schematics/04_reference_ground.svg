<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900"><rect width="1800" height="1900" fill="white"/><text x="55" y="90" font-family="Leelawadee UI,Tahoma" font-size="51" fill="#153449">วงจร 04 • วัดเทียบกราวด์ให้ถูกเน็ต</text><rect x="40" y="125" width="1720" height="130" fill="#fff0cf"/><foreignObject x="65" y="145" width="1670" height="100"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><b>วงจรสอนอ่านที่ผู้จัดทำวาดขึ้น — ไม่ใช่วงจรจริงของกล่อง 01–07</b><br/>ตัวเลขเป็นเงื่อนไขตัวอย่าง ห้ามนำไปป้อนไฟหรือตัดสินจุดจริงในภาพ</div></foreignObject><rect x="100" y="390" width="420" height="230" rx="12" fill="#edf6fa" stroke="#17394e" stroke-width="4"/><text x="118" y="445" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">แหล่งสัญญาณตัวอย่าง</text><path d="M520,450 L1530,450" stroke="#17394e" stroke-width="5" fill="none"/><circle cx="800" cy="450" r="9" fill="#c8740a"/><text x="770" y="422" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">SIGNAL</text><path d="M520,570 L1000,570" stroke="#17394e" stroke-width="5" fill="none"/><text x="540" y="625" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">S_RETURN</text><path d="M1000,570 L1000,750" stroke="#17394e" stroke-width="5" fill="none"/><rect x="1260" y="650" width="410" height="150" rx="12" fill="#edf6fa" stroke="#17394e" stroke-width="4"/><text x="1278" y="705" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">มิเตอร์ B: 2.70 V</text><rect x="570" y="700" width="450" height="150" rx="12" fill="#edf6fa" stroke="#17394e" stroke-width="4"/><text x="588" y="755" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">มิเตอร์ A: 2.50 V</text><path d="M800,450 L800,700" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1000,750 L1020,750" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1530,450 L1530,650" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1460,800 L1460,920" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1460,920 L1460,945" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1430,945 L1490,945" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1440,957 L1480,957" stroke="#17394e" stroke-width="5" fill="none"/><path d="M1450,969 L1470,969" stroke="#17394e" stroke-width="5" fill="none"/><text x="1130" y="1000" font-family="Leelawadee UI,Tahoma" font-size="32" fill="#153449">BODY reference</text><text x="70" y="920" font-family="Leelawadee UI,Tahoma" font-size="38" fill="#153449">สมมติ S_RETURN สูงกว่า BODY 0.20 V</text><foreignObject x="65" y="1000" width="1660" height="740"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e"><h3>เลขเดียวกันจะเปลี่ยนเมื่อเปลี่ยนจุดอ้างอิง</h3><p>สมมติสัญญาณจริงเทียบ S_RETURN = 2.50 V และ S_RETURN สูงกว่า BODY = 0.20 V มิเตอร์ A จึงอ่าน 2.50 V ส่วนมิเตอร์ B อ่าน 2.70 V นี่เป็นตัวอย่างคำนวณ ไม่ใช่ค่า sensor return ที่ยอมรับได้บนรถ</p><p>มิเตอร์ทั้งสองเป็นอินพุตความต้านทานสูง เส้นมิเตอร์ไม่ใช่สาย jumper ห้ามพ่วง S_RETURN ลง BODY เพื่อให้เลขเหมือนกัน การเชื่อมกราวด์ผิดอาจเปลี่ยนวงจรหรือทำให้เสียหาย</p><p>ในการไล่กล่องจริง ต้องยืนยันแหล่งอ้างอิงของขานั้นก่อน ใบ 6 และใบ 7 ยังไม่ยืนยัน reference ใดจากภาพ และบางระบบมีวงจรอ้างอิงต่างศักย์ที่ไม่ควรถือเป็นตัวถัง</p><p>ผลอ่านต่างกันต้องตรวจภาวะโหลด ความต่อเนื่อง และแรงดันตกคร่อมตามคู่มือก่อนสรุปสาเหตุ แหล่งหลักการโพรบ: Tektronix ABCs of Probes</p></div></foreignObject><foreignObject x="65" y="1770" width="1660" height="90"><div xmlns="http://www.w3.org/1999/xhtml" lang="th" style="font:34px/1.4 Leelawadee UI,Tahoma;color:#17394e">สัญลักษณ์เป็นขาหน้าที่ ไม่ใช่เลขขาแพ็กเกจ • ก่อนใช้จริงต้องมี datasheet / pinout / net ที่พิสูจน์แล้ว</div></foreignObject></svg>