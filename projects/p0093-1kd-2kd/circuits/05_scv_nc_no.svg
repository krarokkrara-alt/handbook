<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="context-stroke"/></marker></defs><rect width="1800" height="1250" fill="white"/>
<text x="60" y="55" font-family="Arial, Leelawadee UI, sans-serif" font-size="32" fill="#182b3b">SCV แบบ NC / NO: สภาพไม่จ่ายไฟต่างกัน</text>
<text x="60" y="100" font-family="Arial, Leelawadee UI, sans-serif" font-size="26" fill="#182b3b">Two SCV rest states: never use one unplug rule for both</text>
<text x="60" y="140" font-family="Arial, Leelawadee UI, sans-serif" font-size="21" fill="#596a75">MECHANICAL / HYDRAULIC PRINCIPLE | type is defined with the solenoid DE-ENERGISED</text>
<polyline points="60,165 1740,165" fill="none" stroke="#cad6dc" stroke-width="2"/>
<rect x="100" y="240" width="710" height="600" rx="12" fill="#f5f8fa" stroke="#147aa5" stroke-width="3"/>
<text x="118" y="277" font-family="Arial, Leelawadee UI, sans-serif" font-size="25" fill="#147aa5">NORMALLY CLOSED (NC)</text>
<polyline points="170,490 740,490" fill="none" stroke="#147aa5" stroke-width="7" marker-end="url(#arr)"/>
<rect x="410" y="420" width="70" height="140" fill="#c53838"/>
<text x="230" y="640" font-family="Arial, Leelawadee UI, sans-serif" font-size="28" fill="#c53838">Spring holds passage CLOSED</text>
<text x="195" y="720" font-family="Arial, Leelawadee UI, sans-serif" font-size="24" fill="#182b3b">No electrical command: intake restricted</text>
<rect x="940" y="240" width="710" height="600" rx="12" fill="#f5f8fa" stroke="#147aa5" stroke-width="3"/>
<text x="958" y="277" font-family="Arial, Leelawadee UI, sans-serif" font-size="25" fill="#147aa5">NORMALLY OPEN (NO)</text>
<polyline points="1010,490 1580,490" fill="none" stroke="#147aa5" stroke-width="7" marker-end="url(#arr)"/>
<rect x="1250" y="340" width="70" height="100" fill="#16805e"/>
<text x="1070" y="640" font-family="Arial, Leelawadee UI, sans-serif" font-size="28" fill="#16805e">Spring holds passage OPEN</text>
<text x="1020" y="720" font-family="Arial, Leelawadee UI, sans-serif" font-size="24" fill="#182b3b">No electrical command: intake can be high</text>
<polyline points="60,1040 1740,1040" fill="none" stroke="#cad6dc" stroke-width="2"/>
<text x="70" y="1080" font-family="Arial, Leelawadee UI, sans-serif" font-size="23" fill="#182b3b">DENSO HP3 / HP4 families include NC and NO applications. Identify the fitted pump / SCV first.</text>
<text x="70" y="1115" font-family="Arial, Leelawadee UI, sans-serif" font-size="23" fill="#182b3b">DENSO 00400706E (2009), section 2.2, describes NC SCV for its listed 1KD / 2KD applications.</text>
<text x="70" y="1150" font-family="Arial, Leelawadee UI, sans-serif" font-size="23" fill="#182b3b">This comparison explains rest state; it is NOT an instruction to unplug an SCV on a running engine.</text>
<text x="60" y="1220" font-family="Arial, Leelawadee UI, sans-serif" font-size="19" fill="#596a75">05_scv_nc_no | ภาพหลักการวาดใหม่ ไม่ใช่ผังขา OEM | EDUCATIONAL, NOT OEM PINOUT</text>
</svg>