<text x="70" y="1080" font-family="Arial, Leelawadee UI, sans-serif" font-size="23" fill="#182b3b">Voltage switching + no current: open coil, open harness, poor terminal, or test setup error.</text>
<text x="70" y="1115" font-family="Arial, Leelawadee UI, sans-serif" font-size="23" fill="#182b3b">Current rises + pressure response absent: valve movement and hydraulic delivery still need testing.</text>
<text x="70" y="1150" font-family="Arial, Leelawadee UI, sans-serif" font-size="23" fill="#182b3b">Use an isolated / differential setup of suitable rating; a grounded scope clip can short a driver output.</text>
