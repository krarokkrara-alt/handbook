<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold">วงจร 8.1 สัญญาณ IGT และ IGF กับคอยล์ COP ที่มี Igniter ในตัว (Toyota)</text>
  <text x="480" y="58" text-anchor="middle" fill="#a32c2c">ผังหลักการ ไม่ใช่วงจรจริงของบอร์ดใดบอร์ดหนึ่ง · 1 คอยล์ = 1 สาย IGT</text>

  <!-- ECU -->
  <rect x="30" y="90" width="330" height="330" rx="10" fill="#eef4fc" stroke="#256abf" stroke-width="2"/>
  <text x="195" y="118" text-anchor="middle" font-weight="bold" font-size="17">ภายในกล่อง ECU</text>
  <rect x="55" y="160" width="120" height="80" rx="6" fill="#fff" stroke="#222"/>
  <text x="115" y="195" text-anchor="middle">MCU</text>
  <text x="115" y="217" text-anchor="middle" font-size="13">สร้างจังหวะจุด</text>
  <rect x="205" y="160" width="130" height="80" rx="6" fill="#fff6d6" stroke="#222" stroke-dasharray="5 4"/>
  <text x="270" y="190" text-anchor="middle" font-size="14">วงจรส่งสัญญาณ</text>
  <text x="270" y="210" text-anchor="middle" font-size="14">IGT (บัฟเฟอร์)</text>
  <text x="270" y="230" text-anchor="middle" font-size="12" fill="#555">จุดที่วงในภาพ 8.1</text>
  <line x1="175" y1="200" x2="203" y2="200" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="55" y="300" width="120" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="115" y="330" text-anchor="middle" font-size="14">วงจรรับ IGF</text>
  <text x="115" y="352" text-anchor="middle" font-size="12" fill="#555">(บางรุ่น)</text>
  <line x1="115" y1="300" x2="115" y2="242" stroke="#1f5fbf" stroke-width="2" marker-end="url(#arrb)"/>

  <!-- ECU pins -->
  <circle cx="360" cy="200" r="6" fill="#222"/>
  <circle cx="360" cy="335" r="6" fill="#1f5fbf"/>
  <line x1="175" y1="335" x2="354" y2="335" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="7 5"/>

  <rect x="560" y="90" width="250" height="330" rx="10" fill="#fdeeee" stroke="#b93535" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- wires -->
  <line x1="360" y1="200" x2="583" y2="200" stroke="#222" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="460" y="188" text-anchor="middle" font-size="13" font-weight="bold">IGT</text>
  <text x="460" y="222" text-anchor="middle" font-size="12">≈ 5 V พัลส์ กระแสต่ำ</text>
  <line x1="585" y1="335" x2="366" y2="335" stroke="#1f5fbf" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrb)"/>
  <text x="460" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5fbf">IGF</text>
  <text x="460" y="357" text-anchor="middle" font-size="12" fill="#1f5fbf">ยืนยันว่าจุดระเบิดแล้ว (บางรุ่น)</text>

  <!-- COP -->
  <text x="712" y="118" text-anchor="middle" font-weight="bold" font-size="15">คอยล์ COP (ส่วนใหญ่ 4 สาย)</text>
  <rect x="585" y="160" width="100" height="190" rx="6" fill="#fff" stroke="#222"/>
  <text x="635" y="245" text-anchor="middle">Igniter</text>
  <text x="635" y="267" text-anchor="middle" font-size="12">สับปลายขด</text>
  <text x="635" y="283" text-anchor="middle" font-size="12">ปฐมภูมิลง GND</text>
  <rect x="705" y="160" width="85" height="190" rx="6" fill="#fff" stroke="#222"/>
  <path d="M725 180 q12 8 0 16 q12 8 0 16 q12 8 0 16 q12 8 0 16 q12 8 0 16 q12 8 0 16" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="752" y1="175" x2="752" y2="285" stroke="#222" stroke-width="2"/>
  <line x1="758" y1="175" x2="758" y2="285" stroke="#222" stroke-width="2"/>
  <text x="747" y="318" text-anchor="middle" font-size="12">ขดลวด</text>
  <text x="747" y="334" text-anchor="middle" font-size="12">จุดระเบิด</text>
  <line x1="685" y1="255" x2="705" y2="255" stroke="#222" stroke-width="2"/>
  <line x1="605" y1="140" x2="725" y2="140" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="725" y1="140" x2="725" y2="180" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="605" cy="140" r="4" fill="#c0392b"/>

  <!-- +B and GND -->
  <line x1="605" y1="80" x2="605" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <text x="615" y="84" font-size="13" fill="#c0392b">+B ผ่านสวิตช์กุญแจ (IG2 หรือ EFI ตามผังไฟของรุ่น)</text>
  <line x1="635" y1="350" x2="635" y2="455" stroke="#222" stroke-width="2.5"/>
  <line x1="615" y1="455" x2="655" y2="455" stroke="#222" stroke-width="2.5"/>
  <line x1="622" y1="463" x2="648" y2="463" stroke="#222" stroke-width="2"/>
  <line x1="629" y1="471" x2="641" y2="471" stroke="#222" stroke-width="2"/>
  <text x="662" y="462" font-size="13">GND</text>

  <!-- spark plug -->
  <line x1="790" y1="230" x2="860" y2="230" stroke="#b93535" stroke-width="3" marker-end="url(#arr)"/>
  <text x="826" y="252" text-anchor="middle" font-size="12" fill="#b93535">หลายสิบ kV</text>
  <rect x="862" y="205" width="60" height="50" rx="6" fill="#fff" stroke="#222"/>
  <text x="892" y="226" text-anchor="middle" font-size="13">หัว</text>
  <text x="892" y="244" text-anchor="middle" font-size="13">เทียน</text>

  <text x="30" y="500" font-size="13" fill="#555">คอยล์ COP ของ Toyota ส่วนใหญ่มี 4 สาย: +B, GND, IGT, IGF · IGF อาจเป็นสายร่วมทุกคอยล์ · รุ่นเก่าบางรุ่นใช้ Igniter แยกกล่อง</text>
</svg>
