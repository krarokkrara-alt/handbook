<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="14">
  <rect width="960" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold">วงจร 2.1 ระบบ Immobilizer ของ Toyota วางได้ 3 แบบ</text>
  <text x="480" y="56" text-anchor="middle" fill="#a32c2c">ผังหลักการ · ชื่อกล่องและการเดินสายจริงต้องดูจากคู่มือซ่อมของรุ่นนั้น</text>

  <!-- Row A -->
  <text x="30" y="100" font-size="16" font-weight="bold">แบบ ก · กล่อง Immo แยก</text>
  <rect x="30" y="115" width="140" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="100" y="145" text-anchor="middle">กุญแจ</text><text x="100" y="165" text-anchor="middle" font-size="12">ชิปทรานสปอนเดอร์</text>
  <rect x="230" y="115" width="150" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="305" y="145" text-anchor="middle">ขดลวดเสาอากาศ</text><text x="305" y="165" text-anchor="middle" font-size="12">รอบสวิตช์กุญแจ + วงจรขยาย</text>
  <rect x="440" y="115" width="190" height="70" rx="6" fill="#fdeeee" stroke="#b93535" stroke-width="2"/>
  <text x="535" y="145" text-anchor="middle" font-weight="bold">กล่อง Immo</text><text x="535" y="165" text-anchor="middle" font-size="12">(Transponder key ECU)</text>
  <rect x="690" y="115" width="150" height="70" rx="6" fill="#eef4fc" stroke="#256abf" stroke-width="2"/>
  <text x="765" y="155" text-anchor="middle" font-weight="bold">ECM</text>
  <line x1="170" y1="150" x2="228" y2="150" stroke="#222" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="199" y="140" text-anchor="middle" font-size="11">ไร้สาย</text>
  <line x1="380" y1="150" x2="438" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="630" y1="143" x2="688" y2="143" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="688" y1="160" x2="632" y2="160" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="659" y="135" text-anchor="middle" font-size="11">สื่อสาร</text>
  <rect x="870" y="115" width="70" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="905" y="145" text-anchor="middle" font-size="12">หัวฉีด</text><text x="905" y="163" text-anchor="middle" font-size="12">จุดระเบิด</text>
  <line x1="840" y1="150" x2="868" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row B -->
  <text x="30" y="250" font-size="16" font-weight="bold">แบบ ข · Immo รวมอยู่ใน ECM</text>
  <rect x="30" y="265" width="140" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="100" y="295" text-anchor="middle">กุญแจ</text><text x="100" y="315" text-anchor="middle" font-size="12">ชิปทรานสปอนเดอร์</text>
  <rect x="230" y="265" width="150" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="305" y="295" text-anchor="middle">ขดลวดเสาอากาศ</text><text x="305" y="315" text-anchor="middle" font-size="12">+ วงจรขยาย</text>
  <rect x="440" y="255" width="400" height="90" rx="8" fill="#eef4fc" stroke="#256abf" stroke-width="2"/>
  <text x="640" y="280" text-anchor="middle" font-weight="bold">ECM</text>
  <rect x="460" y="290" width="170" height="44" rx="6" fill="#fdeeee" stroke="#b93535" stroke-width="2"/>
  <text x="545" y="317" text-anchor="middle" font-size="13">ส่วน Immo + ข้อมูลกุญแจ</text>
  <rect x="660" y="290" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="740" y="317" text-anchor="middle" font-size="13">ควบคุมเครื่องยนต์</text>
  <line x1="630" y1="312" x2="658" y2="312" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="170" y1="300" x2="228" y2="300" stroke="#222" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="199" y="290" text-anchor="middle" font-size="11">ไร้สาย</text>
  <line x1="380" y1="300" x2="458" y2="310" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="870" y="265" width="70" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="905" y="295" text-anchor="middle" font-size="12">หัวฉีด</text><text x="905" y="313" text-anchor="middle" font-size="12">จุดระเบิด</text>
  <line x1="840" y1="300" x2="868" y2="300" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row C -->
  <text x="30" y="400" font-size="16" font-weight="bold">แบบ ค · รถกุญแจอัจฉริยะ (Smart Key / ปุ่มสตาร์ท)</text>
  <rect x="30" y="415" width="140" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="100" y="445" text-anchor="middle">รีโมตกุญแจ</text><text x="100" y="463" text-anchor="middle" font-size="12">ชิป + แบต</text><text x="100" y="478" text-anchor="middle" font-size="10">(มีชิปสำรองสตาร์ทฉุกเฉิน)</text>
  <rect x="230" y="415" width="150" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="305" y="445" text-anchor="middle">เสาอากาศในห้องโดยสาร</text><text x="305" y="465" text-anchor="middle" font-size="12">และจุดอ่านฉุกเฉิน</text>
  <rect x="440" y="415" width="190" height="70" rx="6" fill="#fdeeee" stroke="#b93535" stroke-width="2"/>
  <text x="535" y="445" text-anchor="middle" font-weight="bold">กล่องยืนยันกุญแจ</text><text x="535" y="465" text-anchor="middle" font-size="12">(ชื่อเรียกต่างกันตามรุ่น)</text>
  <rect x="690" y="415" width="150" height="70" rx="6" fill="#eef4fc" stroke="#256abf" stroke-width="2"/>
  <text x="765" y="455" text-anchor="middle" font-weight="bold">ECM</text>
  <line x1="170" y1="450" x2="228" y2="450" stroke="#222" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="199" y="440" text-anchor="middle" font-size="11">ไร้สาย</text>
  <line x1="380" y1="450" x2="438" y2="450" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="630" y1="443" x2="688" y2="443" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="688" y1="460" x2="632" y2="460" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="659" y="435" text-anchor="middle" font-size="11">สื่อสาร</text>
  <rect x="870" y="415" width="70" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="905" y="445" text-anchor="middle" font-size="12">หัวฉีด</text><text x="905" y="463" text-anchor="middle" font-size="12">จุดระเบิด</text>
  <line x1="840" y1="450" x2="868" y2="450" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <rect x="30" y="515" width="910" height="64" rx="8" fill="#fff6d6" stroke="#b77700"/>
  <text x="45" y="541" font-size="13">กรอบแดง = ที่เก็บข้อมูลกุญแจที่ลงทะเบียนไว้ · ถ้าเปลี่ยนกล่องในกรอบแดงหรือ ECM ที่จับคู่กันไว้ ต้องจับคู่กุญแจหรือย้ายข้อมูลใหม่</text>
  <text x="45" y="564" font-size="13">ไม่อย่างนั้นรถจะไม่ยอมให้ติด แม้กล่องใหม่จะไม่เสียก็ตาม</text>
</svg>
