<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12">
  <rect width="960" height="720" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold">วงจร 5.2 การต่อสายกล่อง KEFICO E91B (39127-2B530) ตามหน้าที่</text>
  <text x="480" y="64" text-anchor="middle" fill="#555" font-size="11">รายการอุปกรณ์เป็นตัวอย่างของเครื่องเบนซินทั่วไป ยังไม่ได้ยืนยันกับผังไฟของรุ่นนี้ รถจริงอาจมีหรือไม่มีบางรายการ</text>
  <text x="480" y="47" text-anchor="middle" fill="#a32c2c" font-size="12">ผังหลักการ · ช่อง "ขา ____" ว่างไว้ให้กรอกหลังยืนยันจากผังไฟ Hyundai หรือการวัดจริง · ห้ามใช้เลขขาจากภาพผังขาที่แชร์กันทั่วไป</text>

  <!-- ECU -->
  <rect x="360" y="76" width="240" height="620" rx="10" fill="#eef4fc" stroke="#256abf" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" font-weight="bold" font-size="15">ECU KEFICO E91B</text>
  <text x="480" y="116" text-anchor="middle" font-size="11">MEG17.9.12 · ปลั๊ก A และ B</text>
  <rect x="395" y="300" width="170" height="80" rx="6" fill="#fff6d6" stroke="#b77700"/>
  <text x="480" y="328" text-anchor="middle" font-weight="bold">Power IC → MCU</text>
  <text x="480" y="348" text-anchor="middle" font-size="11">ดูหลักการในวงจร 5.1</text>
  <text x="480" y="366" text-anchor="middle" font-size="11">ไฟเลี้ยง · Reset · Clock</text>

  <!-- pin box helper: small white rect with "ขา ____" -->
  <!-- LEFT: power -->
  <text x="20" y="92" font-weight="bold" font-size="13" fill="#c0392b">ไฟเลี้ยงและกราวด์</text>
  <rect x="20" y="102" width="170" height="34" rx="5" fill="#fdeeee" stroke="#c0392b"/><text x="30" y="124">แบตเตอรี่ +12 V (ไฟตลอด)</text>
  <line x1="190" y1="119" x2="358" y2="119" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <rect x="270" y="108" width="80" height="22" rx="3" fill="#fff" stroke="#888"/><text x="310" y="123" text-anchor="middle" font-size="11">ขา ____</text>

  <rect x="20" y="146" width="170" height="34" rx="5" fill="#fdeeee" stroke="#c0392b"/><text x="30" y="168">สวิตช์กุญแจ ON (IG)</text>
  <line x1="190" y1="163" x2="358" y2="163" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <rect x="270" y="152" width="80" height="22" rx="3" fill="#fff" stroke="#888"/><text x="310" y="167" text-anchor="middle" font-size="11">ขา ____</text>

  <rect x="20" y="190" width="170" height="44" rx="5" fill="#fdeeee" stroke="#c0392b"/><text x="30" y="209">รีเลย์หลัก</text><text x="30" y="226" font-size="11">ECU สั่ง · จ่ายไฟเลี้ยงหลัก</text>
  <line x1="190" y1="205" x2="358" y2="205" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <line x1="358" y1="222" x2="192" y2="222" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#k)"/>
  <rect x="270" y="194" width="80" height="22" rx="3" fill="#fff" stroke="#888"/><text x="310" y="209" text-anchor="middle" font-size="11">ขา ____</text>

  <rect x="20" y="244" width="170" height="34" rx="5" fill="#f2f2f2" stroke="#222"/><text x="30" y="266">กราวด์ตัวถัง (หลายขา)</text>
  <line x1="358" y1="261" x2="192" y2="261" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
  <rect x="270" y="266" width="80" height="22" rx="3" fill="#fff" stroke="#888"/><text x="310" y="281" text-anchor="middle" font-size="11">ขา ____</text>

  <!-- LEFT: sensors -->
  <text x="20" y="318" font-weight="bold" font-size="13" fill="#1f5fbf">เซนเซอร์ (สัญญาณเข้า)</text>
  <g font-size="12">
    <rect x="20" y="328" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="348">CKP เพลาข้อเหวี่ยง</text>
    <rect x="20" y="366" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="386">CMP เพลาลูกเบี้ยว</text>
    <rect x="20" y="404" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="424">Knock เซนเซอร์น็อก</text>
    <rect x="20" y="442" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="462">MAP ความดันท่อร่วม</text>
    <rect x="20" y="480" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="500">TPS ตำแหน่งลิ้น</text>
    <rect x="20" y="518" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="538">ECT อุณหภูมิน้ำ</text>
    <rect x="20" y="556" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="576">IAT อุณหภูมิอากาศ</text>
    <rect x="20" y="594" width="170" height="30" rx="5" fill="#fff" stroke="#1f5fbf"/><text x="30" y="614">O2 ไอเสีย</text>
  </g>
  <g stroke="#1f5fbf" stroke-width="1.8">
    <line x1="190" y1="343" x2="358" y2="343" marker-end="url(#b)"/>
    <line x1="190" y1="381" x2="358" y2="381" marker-end="url(#b)"/>
    <line x1="190" y1="419" x2="358" y2="419" marker-end="url(#b)"/>
    <line x1="190" y1="457" x2="358" y2="457" marker-end="url(#b)"/>
    <line x1="190" y1="495" x2="358" y2="495" marker-end="url(#b)"/>
    <line x1="190" y1="533" x2="358" y2="533" marker-end="url(#b)"/>
    <line x1="190" y1="571" x2="358" y2="571" marker-end="url(#b)"/>
    <line x1="190" y1="609" x2="358" y2="609" marker-end="url(#b)"/>
  </g>
  <g font-size="11">
    <rect x="270" y="332" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="346" text-anchor="middle">ขา ____</text>
    <rect x="270" y="370" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="384" text-anchor="middle">ขา ____</text>
    <rect x="270" y="408" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="422" text-anchor="middle">ขา ____</text>
    <rect x="270" y="446" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="460" text-anchor="middle">ขา ____</text>
    <rect x="270" y="484" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="498" text-anchor="middle">ขา ____</text>
    <rect x="270" y="522" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="536" text-anchor="middle">ขา ____</text>
    <rect x="270" y="560" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="574" text-anchor="middle">ขา ____</text>
    <rect x="270" y="598" width="80" height="20" rx="3" fill="#fff" stroke="#888"/><text x="310" y="612" text-anchor="middle">ขา ____</text>
  </g>
  <text x="20" y="646" font-size="11" fill="#1f5fbf">เซนเซอร์แบบ 3 สายรับไฟ +5 V และกราวด์เซนเซอร์</text>
  <text x="20" y="662" font-size="11" fill="#1f5fbf">จาก ECU (ขา +5V ____ · ขากราวด์เซนเซอร์ ____)</text>

  <!-- RIGHT: outputs -->
  <text x="620" y="92" font-weight="bold" font-size="13">ขาออก (ECU สั่ง)</text>
  <!-- injectors -->
  <rect x="770" y="102" width="170" height="130" rx="6" fill="#fff" stroke="#e07b00" stroke-width="1.5"/>
  <text x="780" y="122" font-weight="bold">หัวฉีด 1–4</text>
  <text x="780" y="140" font-size="11">ขั้วหนึ่งรับ +B จากรีเลย์</text>
  <text x="780" y="156" font-size="11">อีกขั้วต่อขา ECU</text>
  <text x="780" y="172" font-size="11">ECU สับลงกราวด์ (8.2, 8.3)</text>
  <g stroke="#e07b00" stroke-width="1.8">
    <line x1="600" y1="130" x2="768" y2="130" marker-end="url(#k)"/>
    <line x1="600" y1="160" x2="768" y2="160" marker-end="url(#k)"/>
    <line x1="600" y1="190" x2="768" y2="190" marker-end="url(#k)"/>
    <line x1="600" y1="220" x2="768" y2="220" marker-end="url(#k)"/>
  </g>
  <g font-size="11">
    <rect x="640" y="120" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="134" text-anchor="middle">สูบ 1 ขา ___</text>
    <rect x="640" y="150" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="164" text-anchor="middle">สูบ 2 ขา ___</text>
    <rect x="640" y="180" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="194" text-anchor="middle">สูบ 3 ขา ___</text>
    <rect x="640" y="210" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="224" text-anchor="middle">สูบ 4 ขา ___</text>
  </g>

  <!-- coils -->
  <rect x="770" y="250" width="170" height="130" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="780" y="270" font-weight="bold">คอยล์ 1–4</text>
  <text x="780" y="288" font-size="11">ชนิดคอยล์ต้องดูคู่มือรุ่น</text>
  <text x="780" y="306" font-size="10.5">มีภาคขับในตัว: ECU ส่งพัลส์สั่งจุด</text>
  <text x="780" y="324" font-size="11">ไม่มีภาคขับ (2 สาย):</text>
  <text x="780" y="340" font-size="11">ECU สับกระแสคอยล์เอง</text>
  <g stroke="#222" stroke-width="1.8">
    <line x1="600" y1="278" x2="768" y2="278" marker-end="url(#k)"/>
    <line x1="600" y1="308" x2="768" y2="308" marker-end="url(#k)"/>
    <line x1="600" y1="338" x2="768" y2="338" marker-end="url(#k)"/>
    <line x1="600" y1="368" x2="768" y2="368" marker-end="url(#k)"/>
  </g>
  <g font-size="11">
    <rect x="640" y="268" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="282" text-anchor="middle">สูบ 1 ขา ___</text>
    <rect x="640" y="298" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="312" text-anchor="middle">สูบ 2 ขา ___</text>
    <rect x="640" y="328" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="342" text-anchor="middle">สูบ 3 ขา ___</text>
    <rect x="640" y="358" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="372" text-anchor="middle">สูบ 4 ขา ___</text>
  </g>

  <!-- relays -->
  <rect x="770" y="398" width="170" height="150" rx="6" fill="#fff" stroke="#b5477b" stroke-width="1.5"/>
  <text x="780" y="418" font-weight="bold">รีเลย์และวาล์ว</text>
  <text x="780" y="438" font-size="11">ปั๊มน้ำมัน</text>
  <text x="780" y="456" font-size="11">พัดลมหม้อน้ำ</text>
  <text x="780" y="474" font-size="11">คอมแอร์</text>
  <text x="780" y="492" font-size="11">วาล์ว Purge (EVAP)</text>
  <text x="780" y="510" font-size="11">ไฟเตือนเครื่องยนต์ (MIL)</text>
  <text x="780" y="530" font-size="10" fill="#555">ส่วนใหญ่ ECU สับลงกราวด์</text>
  <g stroke="#b5477b" stroke-width="1.8">
    <line x1="600" y1="434" x2="768" y2="434" marker-end="url(#k)"/>
    <line x1="600" y1="452" x2="768" y2="452" marker-end="url(#k)"/>
    <line x1="600" y1="470" x2="768" y2="470" marker-end="url(#k)"/>
    <line x1="600" y1="488" x2="768" y2="488" marker-end="url(#k)"/>
    <line x1="600" y1="506" x2="768" y2="506" marker-end="url(#k)"/>
  </g>
  <text x="685" y="425" text-anchor="middle" font-size="10">ขา ___ แต่ละเส้น</text>

  <!-- CAN -->
  <rect x="770" y="566" width="170" height="70" rx="6" fill="#fff" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="780" y="586" font-weight="bold">CAN (สายคู่)</text>
  <text x="780" y="604" font-size="11">คุยกับกล่องอื่นในรถ (ตามรุ่น)</text>
  <text x="780" y="620" font-size="11">และขั้วต่อ OBD</text>
  <line x1="600" y1="592" x2="768" y2="592" stroke="#7b3fa0" stroke-width="1.8" marker-end="url(#p)"/>
  <line x1="768" y1="616" x2="600" y2="616" stroke="#7b3fa0" stroke-width="1.8" marker-end="url(#p)"/>
  <rect x="640" y="594" width="90" height="20" rx="3" fill="#fff" stroke="#888"/><text x="685" y="608" text-anchor="middle" font-size="11">H ___ · L ___</text>

  <rect x="620" y="650" width="320" height="56" rx="6" fill="#fff7e0" stroke="#b77700"/>
  <text x="632" y="670" font-size="11">กรอกเลขขาเมื่อยืนยันแล้วเท่านั้น ระบุปลั๊ก A หรือ B ทุกครั้ง</text>
  <text x="632" y="686" font-size="10.5">หัวฉีดและคอยล์แต่ละสูบต่อกับขาเดียว ถ้าแหล่งไหนบอกว่า</text>
  <text x="632" y="700" font-size="10.5">อยู่ทั้ง A และ B ถือว่าผิด (ไฟเลี้ยงและกราวด์มีหลายขาได้)</text>
</svg>
