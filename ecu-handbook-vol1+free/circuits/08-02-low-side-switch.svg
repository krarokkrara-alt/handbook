<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="14">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold">วงจร 8.2 สวิตช์ฝั่งกราวด์ (Low-side) ขับโหลดขดลวด 1 ช่อง</text>
  <text x="480" y="56" text-anchor="middle" fill="#a32c2c">ผังหลักการ ไม่ใช่ผังขาของชิปหรือวงจรจริงของบอร์ดใด</text>

  <!-- supply -->
  <line x1="560" y1="90" x2="560" y2="120" stroke="#c0392b" stroke-width="2.5"/>
  <text x="575" y="96" font-size="13" fill="#c0392b">+B ผ่านฟิวส์และรีเลย์ (EFI / IG ตามผังไฟของรุ่น)</text>
  <circle cx="560" cy="90" r="4" fill="#c0392b"/>

  <!-- load -->
  <rect x="520" y="120" width="80" height="100" rx="6" fill="#fff" stroke="#222"/>
  <path d="M560 132 q14 8 0 16 q14 8 0 16 q14 8 0 16 q14 8 0 16 q14 8 0 16" fill="none" stroke="#222" stroke-width="2"/>
  <text x="620" y="160" font-size="14">โหลดขดลวด</text>
  <text x="620" y="180" font-size="12" fill="#555">โซลินอยด์ / รีเลย์ / วาล์ว</text>

  <!-- optional external diode -->
  <line x1="470" y1="105" x2="560" y2="105" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="470" y1="105" x2="470" y2="235" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="470" y1="235" x2="560" y2="235" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="460,180 480,180 470,162" fill="none" stroke="#888" stroke-width="1.5"/>
  <line x1="460" y1="160" x2="480" y2="160" stroke="#888" stroke-width="1.5"/>
  <text x="455" y="150" text-anchor="end" font-size="12" fill="#666">ไดโอดคร่อมโหลด</text>
  <text x="455" y="166" text-anchor="end" font-size="12" fill="#666">(มีในบางระบบ: ในกล่อง ECU</text>
  <text x="455" y="182" text-anchor="end" font-size="12" fill="#666">หรือในตัวโหลด/รีเลย์</text>
  <text x="455" y="198" text-anchor="end" font-size="12" fill="#666">ห้ามเพิ่ม/ถอดเอง)</text>

  <!-- OUT pin -->
  <line x1="560" y1="220" x2="560" y2="290" stroke="#222" stroke-width="2.5"/>
  <circle cx="560" cy="235" r="5" fill="#222"/>
  <text x="575" y="240" font-weight="bold">ขาขั้วต่อ ECU</text>
  <text x="575" y="258" font-size="12" fill="#555">= ขา OUT ของชิป (ไล่ลายจริงทุกครั้ง)</text>

  <!-- ECU box -->
  <rect x="40" y="275" width="880" height="230" rx="10" fill="#eef4fc" stroke="#256abf" stroke-width="2"/>
  <text x="60" y="300" font-weight="bold" font-size="16">ภายในกล่อง ECU</text>

  <rect x="70" y="345" width="120" height="70" rx="6" fill="#fff" stroke="#222"/>
  <text x="130" y="377" text-anchor="middle">MCU</text>
  <text x="130" y="397" text-anchor="middle" font-size="12">สั่งเปิด-ปิด</text>

  <rect x="230" y="310" width="470" height="180" rx="8" fill="#fff6d6" stroke="#b77700" stroke-dasharray="6 4"/>
  <text x="245" y="480" font-size="13" font-weight="bold">IPS เช่น F5063 (1 ใน 2 ช่อง)</text>

  <rect x="250" y="350" width="130" height="60" rx="6" fill="#fff" stroke="#222"/>
  <text x="315" y="375" text-anchor="middle" font-size="13">ควบคุม /</text>
  <text x="315" y="393" text-anchor="middle" font-size="13">ป้องกัน</text>
  <line x1="190" y1="380" x2="248" y2="380" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="219" y="372" text-anchor="middle" font-size="12">IN</text>

  <!-- MOSFET -->
  <line x1="380" y1="380" x2="520" y2="380" stroke="#222" stroke-width="2"/>
  <line x1="520" y1="355" x2="520" y2="405" stroke="#222" stroke-width="3"/>
  <line x1="530" y1="350" x2="530" y2="410" stroke="#222" stroke-width="3"/>
  <line x1="530" y1="360" x2="560" y2="360" stroke="#222" stroke-width="2"/>
  <line x1="530" y1="400" x2="560" y2="400" stroke="#222" stroke-width="2"/>
  <line x1="560" y1="290" x2="560" y2="360" stroke="#222" stroke-width="2.5"/>
  <line x1="560" y1="400" x2="560" y2="470" stroke="#222" stroke-width="2.5"/>
  <text x="575" y="372" font-size="13">MOSFET</text>
  <text x="575" y="390" font-size="12" fill="#555">สับปลายโหลดลงกราวด์</text>

  <!-- clamp -->
  <line x1="560" y1="320" x2="460" y2="320" stroke="#a32c2c" stroke-width="2"/>
  <line x1="460" y1="320" x2="460" y2="380" stroke="#a32c2c" stroke-width="2"/>
  <polygon points="451,346 469,346 460,332" fill="#fff" stroke="#a32c2c" stroke-width="2"/>
  <polyline points="449,334 452,332 468,332 471,330" fill="none" stroke="#a32c2c" stroke-width="2"/>
  <polygon points="451,352 469,352 460,366" fill="#fff" stroke="#a32c2c" stroke-width="2"/>
  <line x1="451" y1="367" x2="469" y2="367" stroke="#a32c2c" stroke-width="2"/>
  <text x="445" y="300" text-anchor="end" font-size="12" fill="#a32c2c">วงจร Clamp ภายใน</text>
  <text x="445" y="316" text-anchor="end" font-size="11" fill="#a32c2c">(ซีเนอร์ + ไดโอดกันย้อน</text>
  <text x="445" y="330" text-anchor="end" font-size="11" fill="#a32c2c">ถ้ารุ่นนั้นมี ตรวจในดาต้าชีต)</text>

  <!-- GND -->
  <line x1="540" y1="470" x2="580" y2="470" stroke="#222" stroke-width="2.5"/>
  <line x1="547" y1="478" x2="573" y2="478" stroke="#222" stroke-width="2"/>
  <line x1="554" y1="486" x2="566" y2="486" stroke="#222" stroke-width="2"/>
  <text x="590" y="478" font-size="13">GND กำลัง</text>

  <rect x="730" y="320" width="175" height="175" rx="6" fill="#fff" stroke="#888"/>
  <text x="745" y="345" font-size="13" font-weight="bold">ตอนตัดกระแส</text>
  <text x="745" y="368" font-size="12">ขดลวดดันแรงดันที่ OUT</text>
  <text x="745" y="386" font-size="12">ให้สูงกว่า +B</text>
  <text x="745" y="410" font-size="12">Clamp ในชิป หรือไดโอด</text>
  <text x="745" y="428" font-size="12">คร่อมโหลด เป็นตัวรับ</text>
  <text x="745" y="446" font-size="12">พลังงานนี้</text>
  <text x="745" y="468" font-size="11" fill="#555">ไดโอดในตัว MOSFET (ไม่ได้วาด)</text>
  <text x="745" y="484" font-size="11" fill="#555">ไม่ทำงานในจังหวะนี้</text>

  <text x="40" y="535" font-size="13" fill="#555">โหลดปกติแล้วชิปเสียซ้ำ → ตรวจโหลดหรือสายช็อตก่อนเปลี่ยนชิปทุกครั้ง</text>
</svg>
