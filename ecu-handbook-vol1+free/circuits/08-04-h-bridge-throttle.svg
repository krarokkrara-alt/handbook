<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="14">
  <rect width="960" height="600" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold">วงจร 8.4 H-Bridge ขับมอเตอร์ลิ้นปีกผีเสื้อ (ETCS) กลับทิศได้</text>
  <text x="480" y="56" text-anchor="middle" fill="#a32c2c">ผังหลักการ ไม่ใช่วงจรจริงหรือผังขาของชิปใด · ชื่อขา +BM / ME01 ตัวอย่างจากเครื่อง 1NZ-FE</text>

  <!-- ECU box -->
  <rect x="40" y="110" width="600" height="420" rx="10" fill="#eef4fc" stroke="#256abf" stroke-width="2"/>
  <text x="60" y="136" font-weight="bold" font-size="16">ภายในกล่อง ECU</text>

  <!-- supply -->
  <circle cx="400" cy="84" r="4" fill="#c0392b"/>
  <line x1="400" y1="84" x2="400" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <text x="412" y="90" font-size="13" fill="#c0392b">ขา +BM: ไฟแบตเตอรี่ผ่านฟิวส์ของระบบลิ้นปีกผีเสื้อ (มีไฟตลอด)</text>

  <!-- rails -->
  <line x1="250" y1="160" x2="550" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="250" y1="480" x2="550" y2="480" stroke="#222" stroke-width="2.5"/>
  <line x1="400" y1="480" x2="400" y2="545" stroke="#222" stroke-width="2.5"/>
  <line x1="380" y1="545" x2="420" y2="545" stroke="#222" stroke-width="2.5"/>
  <line x1="387" y1="552" x2="413" y2="552" stroke="#222" stroke-width="2"/>
  <text x="430" y="551" font-size="13">ขา ME01: กราวด์กำลังของภาคขับมอเตอร์</text>

  <!-- left leg -->
  <line x1="250" y1="160" x2="250" y2="200" stroke="#222" stroke-width="2"/>
  <rect x="220" y="200" width="60" height="60" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="250" y="236" text-anchor="middle" font-weight="bold">S1</text>
  <line x1="250" y1="260" x2="250" y2="380" stroke="#222" stroke-width="2"/>
  <rect x="220" y="380" width="60" height="60" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="250" y="416" text-anchor="middle" font-weight="bold">S2</text>
  <line x1="250" y1="440" x2="250" y2="480" stroke="#222" stroke-width="2"/>

  <!-- right leg -->
  <line x1="550" y1="160" x2="550" y2="200" stroke="#222" stroke-width="2"/>
  <rect x="520" y="200" width="60" height="60" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="550" y="236" text-anchor="middle" font-weight="bold">S3</text>
  <line x1="550" y1="260" x2="550" y2="380" stroke="#222" stroke-width="2"/>
  <rect x="520" y="380" width="60" height="60" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="550" y="416" text-anchor="middle" font-weight="bold">S4</text>
  <line x1="550" y1="440" x2="550" y2="480" stroke="#222" stroke-width="2"/>

  <!-- left midpoint -> M+ (goes up and around top-right) -->
  <circle cx="250" cy="320" r="4" fill="#222"/>
  <line x1="250" y1="320" x2="320" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="320" y1="320" x2="320" y2="180" stroke="#222" stroke-width="2"/>
  <path d="M320 180 L541 180 A9 9 0 0 1 559 180 L610 180" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="610" y1="180" x2="610" y2="290" stroke="#222" stroke-width="2"/>
  <line x1="610" y1="290" x2="740" y2="290" stroke="#222" stroke-width="2"/>
  <!-- right midpoint -> M- -->
  <circle cx="550" cy="320" r="4" fill="#222"/>
  <line x1="550" y1="320" x2="600" y2="320" stroke="#222" stroke-width="2"/>
  <line x1="600" y1="320" x2="600" y2="370" stroke="#222" stroke-width="2"/>
  <line x1="600" y1="370" x2="740" y2="370" stroke="#222" stroke-width="2"/>

  <!-- connector pins -->
  <circle cx="640" cy="290" r="5" fill="#222"/>
  <circle cx="640" cy="370" r="5" fill="#222"/>
  <text x="650" y="282" font-size="13" font-weight="bold">ขา M+</text>
  <text x="650" y="392" font-size="13" font-weight="bold">ขา M-</text>

  <!-- motor -->
  <line x1="740" y1="290" x2="790" y2="290" stroke="#222" stroke-width="2"/>
  <line x1="790" y1="290" x2="790" y2="300" stroke="#222" stroke-width="2"/>
  <line x1="740" y1="370" x2="790" y2="370" stroke="#222" stroke-width="2"/>
  <line x1="790" y1="370" x2="790" y2="360" stroke="#222" stroke-width="2"/>
  <circle cx="790" cy="330" r="30" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="790" y="337" text-anchor="middle" font-size="20" font-weight="bold">M</text>
  <text x="830" y="322" font-size="13">มอเตอร์</text>
  <text x="830" y="340" font-size="13">ลิ้นปีกผีเสื้อ</text>

  <!-- control -->
  <rect x="70" y="180" width="110" height="64" rx="6" fill="#fff" stroke="#222"/>
  <text x="125" y="208" text-anchor="middle">MCU</text>
  <text x="125" y="228" text-anchor="middle" font-size="12">PWM + ทิศ</text>
  <line x1="180" y1="212" x2="218" y2="212" stroke="#222" stroke-width="2" marker-end="url(#k)"/>
  <text x="125" y="268" text-anchor="middle" font-size="11" fill="#555">(สั่งสวิตช์ S1–S4 ทั้ง 4 ตัว</text>
  <text x="125" y="283" text-anchor="middle" font-size="11" fill="#555">ผ่านวงจรขับ)</text>

  <!-- direction table -->
  <rect x="70" y="330" width="140" height="120" rx="6" fill="#fff" stroke="#888"/>
  <text x="82" y="352" font-size="12" font-weight="bold">ทิศกระแสในมอเตอร์</text>
  <text x="82" y="376" font-size="12" fill="#1a8633">S1 + S4 นำ:</text>
  <text x="82" y="392" font-size="12" fill="#1a8633">M+ → มอเตอร์ → M-</text>
  <text x="82" y="418" font-size="12" fill="#c25124">S3 + S2 นำ:</text>
  <text x="82" y="434" font-size="12" fill="#c25124">M- → มอเตอร์ → M+</text>

  <!-- notes -->
  <rect x="680" y="420" width="260" height="135" rx="6" fill="#fff" stroke="#888"/>
  <text x="692" y="444" font-size="13" font-weight="bold">จำไว้</text>
  <text x="692" y="466" font-size="12">M+ / M- ไม่มีขาไหนเป็นไฟหรือกราวด์ตายตัว</text>
  <text x="692" y="488" font-size="12">วัดด้วยสโคป 2 ช่อง (A−B)</text>
  <text x="692" y="504" font-size="12" fill="#a32c2c">ห้ามหนีบกราวด์โพรบที่ M+ / M-</text>
  <text x="692" y="526" font-size="12">ห้ามเปิด S1+S2 หรือ S3+S4 พร้อมกัน</text>
  <text x="692" y="542" font-size="12">(ลัดรางไฟลงกราวด์)</text>
</svg>
