<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 830" width="1090" height="830" font-family="Tahoma, &quot;Leelawadee UI&quot;, sans-serif">
<rect width="1090" height="830" fill="#ffffff"/>
<text class="t" x="30" y="32" font-size="22" text-anchor="start" font-weight="bold" fill="#111111">ต่อโต๊ะทดสอบ: หลักการจากผังขา</text>
<rect class="b" x="40" y="80" width="180" height="130" rx="3" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text class="t" x="130" y="130" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">แหล่งจ่าย</text>
<text class="t" x="130" y="156" font-size="15" text-anchor="middle" fill="#111111">+12 V</text>
<text class="t" x="206" y="106" font-size="20" text-anchor="end" font-weight="bold" fill="#111111">+</text>
<text class="t" x="206" y="196" font-size="20" text-anchor="end" font-weight="bold" fill="#111111">−</text>
<polyline class="w" points="220,100 236,100" fill="none" stroke="#d52830" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M236 100 q11 -14 22 0 q11 14 22 0" fill="none" stroke="#d52830" stroke-width="3"/><circle cx="236" cy="100" r="5" fill="#fff" stroke="#d52830" stroke-width="2.4"/><circle cx="280" cy="100" r="5" fill="#fff" stroke="#d52830" stroke-width="2.4"/>
<text class="t" x="258" y="80" font-size="15" text-anchor="middle" fill="#111111">ฟิวส์</text>
<polyline class="w" points="285,100 430,100" fill="none" stroke="#d52830" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="300" cy="100" r="6" fill="#d52830"/>
<polyline class="w" points="300,100 300,150 430,150" fill="none" stroke="#d52830" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline class="w" points="220,190 360,190 360,270 430,270" fill="none" stroke="#111111" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="360" cy="220" r="6" fill="#111111"/>
<polyline class="w" points="360,220 430,220" fill="none" stroke="#111111" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="b" x="40" y="320" width="180" height="130" rx="3" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text class="t" x="130" y="372" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">เครื่องกำเนิด</text>
<text class="t" x="130" y="398" font-size="15" text-anchor="middle" fill="#111111">สัญญาณ</text>
<text class="t" x="208" y="354" font-size="15" text-anchor="end" fill="#111111">OUT</text>
<text class="t" x="208" y="436" font-size="15" text-anchor="end" fill="#111111">COM</text>
<polyline class="w" points="220,348 430,348" fill="none" stroke="#0d5fb0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline class="w" points="220,430 360,430 360,270" fill="none" stroke="#111111" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="360" cy="270" r="6" fill="#111111"/>
<polyline class="w" points="430,400 300,400" fill="none" stroke="#0d5fb0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/>
<text class="t" x="240" y="406" font-size="15" text-anchor="start" fill="#111111">ขา 25 ?</text>
<rect class="b" x="430" y="70" width="300" height="410" rx="3" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text class="t" x="580" y="320" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">EDU</text>
<text class="t" x="442" y="106" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">7</text>
<text class="t" x="442" y="156" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">4</text>
<text class="t" x="442" y="226" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">12</text>
<text class="t" x="442" y="276" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">17</text>
<text class="t" x="442" y="354" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">22</text>
<text class="t" x="442" y="406" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">25</text>
<text class="t" x="718" y="176" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">14</text>
<text class="t" x="718" y="326" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">20</text>
<text class="t" x="290" y="340" font-size="15" text-anchor="start" font-weight="bold" fill="#0d5fb0">ขา 22 ?</text>
<polyline class="w" points="730,170 900,170 900,190" fill="none" stroke="#ee7a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M900 190 a11 13.75 0 0 0 0 27.5 a11 13.75 0 0 0 0 27.5 a11 13.75 0 0 0 0 27.5 a11 13.75 0 0 0 0 27.5" fill="none" stroke="#ee7a00" stroke-width="3"/>
<polyline class="w" points="900,300 900,320 730,320" fill="none" stroke="#ee7a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text class="t" x="930" y="240" font-size="15" text-anchor="start" fill="#111111">คอยล์</text>
<text class="t" x="930" y="262" font-size="15" text-anchor="start" fill="#111111">Spill Valve</text>
<text class="t" x="815" y="160" font-size="15" text-anchor="middle" fill="#111111">0.85 B/W, E-29/2</text>
<text class="t" x="815" y="346" font-size="15" text-anchor="middle" fill="#111111">0.85 B/L, E-29/1</text>
<rect class="b" x="40" y="500" width="1010" height="310" rx="3" fill="#fdf0f0" stroke="#d52830" stroke-width="2.4"/>
<text class="t" x="60" y="532" font-size="18" text-anchor="start" font-weight="bold" fill="#d52830">ยังยืนยันไม่ได้ว่าขาสัญญาณคือ 22 หรือ 25</text>
<text class="t" x="60" y="562" font-size="15" text-anchor="start" fill="#111111">เส้นทึบที่ขา 22 มาจากการตีความผัง ECM. เส้นประมาจากกล่องเลขฉลาก 1.7L. อย่าต่อสองขาพร้อมกัน</text>
<text class="t" x="60" y="592" font-size="15" text-anchor="start" fill="#111111">ขา 14, 20 และขั้วคอยล์มีไฟสูงเมื่อกล่องทำงาน ห้ามแตะ. ต่อคอยล์ให้แน่น หุ้มขั้ว ก่อนจ่ายไฟ</text>
<text class="t" x="60" y="712" font-size="15" text-anchor="start" fill="#111111">ห้ามปล่อยขา 14, 20 ลอยขณะจ่ายไฟ. ฟิวส์ในภาพไม่กำหนดค่า เพราะยังไม่มีค่ายืนยัน</text>
<text class="t" x="60" y="748" font-size="15" text-anchor="start" font-weight="bold" fill="#d52830">เลขขาทั้งภาพเป็นของ 4JH1-TC ยังไม่ได้เทียบกับกล่องฉลาก 1.7L ในภาพถ่าย</text>
<text class="t" x="60" y="778" font-size="15" text-anchor="start" font-weight="bold" fill="#d52830">ห้ามจ่ายไฟตามเลขนี้จนกว่าจะไล่ขาในกล่องของคุณเอง</text>
<text class="t" x="60" y="622" font-size="15" text-anchor="start" fill="#111111">ปิดไฟก่อนย้ายสาย. ตัวเก็บประจุอาจยังมีไฟหลังปิด ต้องคายประจุและวัดยืนยันก่อนแตะบอร์ด</text>
<text class="t" x="60" y="652" font-size="15" text-anchor="start" fill="#111111">ผังนี้สรุปจากเลขขาในผังรถ ยังไม่ได้เทียบทุกสายกับชุดทดสอบในภาพ. ความถี่สัญญาณยังไม่มีค่ายืนยัน</text>
<text class="t" x="60" y="682" font-size="15" text-anchor="start" fill="#111111">ต่อ COM ของเครื่องกำเนิดลงกราวด์ร่วมกับขา 12, 17 ไม่เช่นนั้นสัญญาณไม่มีทางกลับ</text>
</svg>
